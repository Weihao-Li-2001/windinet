# VAE full finetuning, 256res, 10 epochs -- accum=4 arm (TEST).
#
# Identical to the _acc1 sibling in every field -- same LR, scheduler,
# adapter, loss weights, epochs, batch_size. The ONLY difference is how
# this one gets launched (see Submit below): batch_size stays 4 (still
# hardcoded by jobs/sng_pvc/finetune_vae.sbatch), but EFFECTIVE_BATCH=128
# forces patch_config_for_cluster() to derive gradient_accumulation_steps=4
# instead of the cluster-default 1 (128 / (4 batch_size x 8 XPU tiles) = 4).
# See the _acc1 sibling's header for the full PURPOSE note.
#
# CAVEAT, WORSE HERE THAN THE _acc1 SIBLING: warmup_steps=200 is unchanged,
# but effective_batch=128 (4x the _acc1 arm's 32) means steps_per_epoch
# drops to ~3825/128 = ~30, so 10 epochs is only ~300 total optimizer steps
# -- warmup_steps=200 is now ~66.7% of the ENTIRE run, not a minority phase.
# This arm will barely reach the wsd schedule's "stable" plateau before
# decay starts, let alone spend meaningful time there. That's an inherent,
# expected side effect of quadrupling effective_batch without also
# shrinking warmup_steps (or extending epochs) to compensate -- not a
# mistake in this file, but read the resulting LR-vs-loss curve with that
# in mind: a worse/slower-looking result here may be an artifact of this
# schedule mismatch, not proof that a bigger effective_batch trains worse.
# If a real, fair comparison of final quality is wanted later (not just the
# runtime/step-count question this pair was written for), warmup_steps
# should be scaled down (e.g. 200/4 = 50) or optimization.epochs raised to
# compensate before drawing conclusions from val_vrmse.
#
# Submit with the 256x256_ds override AND EFFECTIVE_BATCH=128 (sng_pvc's
# cluster default is 128x128_ds / effective_batch=32 -- forgetting either
# override breaks this arm's whole point):
#   EFFECTIVE_BATCH=128 sbatch --time=10:00:00 jobs/sng_pvc/finetune_vae.sbatch \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep10_256res_acc4.yaml \
#       "${SCRATCH}/windinet/euler_mq_dataset/256x256_ds/train.h5"

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  # Placeholder -- overridden at launch by the sbatch script's data_root
  # argument (see Usage above). Only meaningful if this config is ever run
  # through a launcher that does NOT override data_root.
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "wsd", "10ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "256res", "acc-sweep", "acc4"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep10_256res_acc4"
clean_output_dir: true
