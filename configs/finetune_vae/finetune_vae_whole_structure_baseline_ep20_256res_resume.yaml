# Resume of finetune_vae_whole_structure_baseline_ep20_256res.yaml -- NOT a
# new experiment, no variable changes vs that config except resuming.
#
# Job 529528 (sng_pvc, 8 XPU tiles) reached epoch 19/20 ("New best checkpoint
# (epoch 19, val_vrmse=0.059947)") but the last locally-synced log snapshot
# (2026-08-28, ~12:47 CEST) had no END TIME line and no CANCELLED message --
# per the user, the job had stopped by the time they checked. This resumes
# from epoch 19's checkpoint to finish the single remaining epoch, same
# pattern as finetune_vae_whole_structure_baseline_ep30_256res_kl1e5_resume.yaml
# (lrz_ai's equivalent one-epoch-short resume).
#
# resume_from points at the checkpoint's path as seen inside the sng_pvc job
# ($SCRATCH = /hppfs/scratch/0D/go76fuz2, confirmed from job 529528's own
# VAE_CHECKPOINT/DATA_ROOT log lines and windinet/cluster_config.py's
# CLUSTER_DEFAULTS['sng_pvc']['output_root']).
#
# clean_output_dir: false (only change vs the original config, besides
# resume_from/resume_weights_only) -- keeps the existing checkpoints/ and
# visualizations/ from epochs 1-19 in place instead of wiping output_dir.
# Note metrics.csv will only cover the epoch(s) this resumed process itself
# runs -- VaeTrainer.train() accumulates metrics_history in-memory per
# process, not reloaded from an existing metrics.csv on resume -- the full
# epoch 1-19 curve stays available in logs/sng_pvc/529528-wh_finetune_vae.out.
#
# batch_size stays whatever jobs/sng_pvc/finetune_vae.sbatch hardcodes (4) --
# unlike lrz_ai's BATCH_SIZE env var, sng_pvc's launcher has no separate
# override path, so there's no risk of silently resuming under a different
# batch_size than epochs 1-19 used.
#
# Usage (--time=03:00:00: only 1 epoch left, ~44min/epoch measured, generous
# margin per the user's own 2-3h request):
#   sbatch --time=03:00:00 jobs/sng_pvc/finetune_vae.sbatch \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep20_256res_resume.yaml \
#       "${SCRATCH}/windinet/euler_mq_dataset/256x256_ds/train.h5"

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

# THE variable: resume from epoch 19's checkpoint, restoring optimizer/
# scheduler/step state too (resume_weights_only: false) so training
# continues at epoch 20 instead of restarting the schedule.
resume_from: "/hppfs/scratch/0D/go76fuz2/windinet/finetune_vae_outputs_sng_pvc/finetune_vae_whole_structure_baseline_ep20_256res/checkpoints/vae_shockwave_last.safetensors"
resume_weights_only: false

data:
  # Placeholder -- overridden at launch by jobs/sng_pvc/finetune_vae.sbatch's
  # $2 argument (see Usage above). Only meaningful if this config is ever run
  # through a launcher that does NOT override data_root.
  data_root: "/hppfs/scratch/0D/go76fuz2/windinet/euler_mq_dataset/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "wsd", "20ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "256res", "kl-sweep", "resume"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep20_256res"
# THE other variable: false, not true -- resuming into the same output_dir
# must not wipe the checkpoints/visualizations already there.
clean_output_dir: false
