# VAE finetuning config -- fresh-channel init `mean` -> `zeros` (Open
# Question 21, EXPERIMENTS.md). PhD-advisor-motivated (2026-08-12): the
# whole-structure baseline's 4th channel (density/momentum_x/momentum_y/
# pressure order -> pressure sits in the fresh, index-3 slot) has low
# val_vrmse but visually still looks like a superposition of the other 3
# channels, not an independent prediction.
#
# WHY THIS IS THE RIGHT FIRST TEST: `inflate_vae_io_channels`'s `mean`
# init (`windinet/vae_adapter.py:220-343`, `_fill_new_blocks`) seeds
# `decoder.conv_out`'s (and `encoder.conv_in`'s) fresh-channel weight
# block as the literal elementwise mean of the 3 pretrained-slot weight
# blocks -- at step 0 the fresh channel's output IS an average of what
# the other 3 channels would produce. Whether training fully escapes that
# starting point, or lands in a nearby basin that still resembles an
# average (plausible: this dataset's 4 fields are physically correlated
# through the same shock structure, and a mostly-RMSE objective doesn't
# explicitly penalize "this channel correlates with the mean of the
# others"), is untested -- `zeros` removes the averaged prior entirely
# (fresh channel starts at literal 0 output, learns purely from its own
# gradient signal) and is the cleanest counter-experiment. This closes a
# gap the ledger already flags in "NOT established": "mean vs zeros init
# has never been cleanly isolated" -- the only prior comparison (#5 zeros
# vs #6 mean, old pre-whole-structure baseline) found zeros *slightly*
# better but was confounded by a second variable (tail3x schedule).
#
# COMPLEMENTARY DIAGNOSTIC: `scripts/inflate_weight_drift.py` (no
# training, no GPU) directly measures whether the CURRENT `mean`-init
# checkpoint's fresh channel has moved away from "looks like the average
# of the other 3" -- run that on the existing whole-structure-baseline
# checkpoint before/alongside this run to distinguish "still stuck at
# init" (favors more training / higher LR on that slot) from "moved but
# still converges near an average-like solution" (favors this init
# change or a loss-side fix instead).
#
# NOT the same question as Open Question 10 (copy-init for momentum_x/
# momentum_y): that tested copying a *specific sibling* channel's
# pretrained weights instead of averaging, and came back null on
# val_vrmse (0.09831 vs 0.09841, inside noise) -- but its qualitative/
# per-channel behavior was never actually inspected, and it was run on
# the old frozen-trunk lineage besides. `zeros` here removes the averaged
# prior rather than swapping which slot it's averaged/copied from, is
# run on the current whole-structure baseline, and is motivated by the
# qualitative artifact specifically, not just val_vrmse.
#
# SINGLE VARIABLE vs `finetune_vae_whole_structure_baseline.yaml` (18
# epochs, 0.3x encoder LR, whole-structure unfreeze, confirmed val_vrmse
# 0.08360, job 523577):
#   adapter.inflate_init: "mean" -> "zeros"
# Everything else UNCHANGED.
#
# READ-OUT: two-part, per "THE QUESTION" framing elsewhere in this
# ledger -- a win here does not have to mean val_vrmse improves.
#   1. Quantitative: compare epoch-18 val_vrmse (and per-channel
#      val_vrmse_pressure specifically, since pressure is the fresh slot
#      under the default channel order) to the baseline's 0.08360 /
#      0.09733 pressure, against the ~1.1% seed-noise floor. `zeros`
#      could plausibly read *worse* on the aggregate (no pretrained-
#      derived prior to start from on that slot) while still fixing the
#      qualitative artifact -- that would still be informative, not a
#      failed run.
#   2. Qualitative (the actual motivating question): pull this run's
#      epoch-18 reconstruction panels and compare the pressure channel's
#      residual/shape against the `mean`-init baseline's -- does the
#      "looks like a blend of the other 3 channels" impression go away?
#      This is the read-out that actually answers the PhD advisor's
#      question; val_vrmse alone cannot.
#
# KILL CRITERION: usual (epoch 2 train_loss above epoch 1's) -- BUT
# expect a rougher epoch 1-2 than `mean` init on the fresh channel
# specifically (no averaged pretrained-derived starting point), same
# "epoch 1 looks rough, don't over-read it alone" caveat as every other
# init-change run in this ledger (`inflate_init: random`'s much worse
# epoch 1 being the extreme version of the same effect). Genuine kill
# signal: train_loss still elevated / diverging by epoch 4-5, not just a
# rough epoch 1.
#
# Usage:
#   sbatch jobs/sng_pvc/finetune_vae.sbatch configs/finetune_vae/finetune_vae_whole_structure_baseline_zerosinit.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0
  unfreeze_down_blocks: [0, 1, 2]
  unfreeze_encoder_tail: true

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  adapter_lr_multiplier: 1.0
  encoder_tail_lr_multiplier: 0.3
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 18
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "wsd", "18ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "init-ablation"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_zerosinit"
clean_output_dir: true
