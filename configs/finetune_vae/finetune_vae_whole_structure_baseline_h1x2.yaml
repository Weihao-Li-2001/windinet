# VAE finetuning config -- h1 WEIGHT 50 -> 100, retested for the first
# time under the whole-structure + 18-epoch baseline (Open Question 16).
#
# THE QUESTION: h1's weight (50.0) was last tuned as "25 -> 50" under the
# OLD frozen-trunk baseline, before the encoder trunk was unfrozen (Open
# Question 3) or epochs went 15 -> 18 (Open Question 7) -- both changed
# the trainable-parameter count and the optimization schedule
# substantially, and the "loss-weight axis is exhausted" finding
# ("Established", EXPERIMENTS.md) predates both. Untested direction:
# does going further (100, doubling again) help, hurt, or land in the
# same ~2% noise band every prior h1/mlw magnitude perturbation did?
#
# SINGLE VARIABLE vs finetune_vae_whole_structure_baseline.yaml (18
# epochs, 0.3x encoder LR, whole-structure unfreeze):
#   loss_weighting.weights.h1:  50.0 -> 100.0
# Everything else UNCHANGED.
#
# READ-OUT: compare epoch-18 val_vrmse to the reconfirmed baseline's
# ~0.0834, against the ~1.1% seed-noise floor (Open Question 1).
#
# KILL CRITERION: usual (epoch 2 train_loss above epoch 1's). Mild watch
# on early epochs -- h1 already dominates the weighted sum at 50.0 (see
# "Weight choice" note in finetune_vae_whole_structure_baseline_h2.yaml
# for h1's raw-magnitude bookkeeping); doubling it again shifts the
# gradient balance further toward smoothness at amplitude accuracy's
# expense, though nothing in this ledger's h1 history suggests instability
# risk at this scale (unlike e.g. decoder LR 2x, which was flagged in Q9
# for a real divergence-risk architecture reason).
#
# Usage:
#   sbatch jobs/sng_pvc/finetune_vae.sbatch configs/finetune_vae/finetune_vae_whole_structure_baseline_h1x2.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "mean"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0
  unfreeze_down_blocks: [0, 1, 2]
  unfreeze_encoder_tail: true

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  adapter_lr_multiplier: 1.0
  encoder_tail_lr_multiplier: 0.3
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 18
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    # THE variable: 50.0 -> 100.0.
    h1: 100.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "wsd", "18ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "h1x2"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_h1x2"
clean_output_dir: true
