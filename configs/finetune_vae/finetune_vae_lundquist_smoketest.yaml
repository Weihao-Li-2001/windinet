# Throwaway VAE config -- NOT an EXPERIMENTS.md ledger entry.
#
# Only purpose: produce SOME inflate-mode checkpoint on lundquist, fast, so
# jobs/lundquist/dit_smoketest.sbatch has a VAE checkpoint to preprocess
# with (finetune_vae_outputs/lundquist currently has none -- checkpoints/
# is gitignored and no run has been made on this cluster since the last
# clean checkout). Identical to finetune_vae_whole_structure_baseline_ep30.yaml
# except optimization.epochs: 30 -> 4 and a distinct output_dir so it can't
# collide with (or get overwritten by) a real baseline run. val_vrmse from
# this run means nothing -- do not record it anywhere.
#
# Usage:
#   sbatch jobs/lundquist/finetune_vae_2gpu.sbatch configs/finetune_vae/finetune_vae_lundquist_smoketest.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 4
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: false
  interval_epochs: 1
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["smoketest", "throwaway"]

seed: 42
output_dir: "finetune_vae_dit_smoketest_source"
clean_output_dir: true
