# VAE finetuning config -- RMSE-ONLY LOSS ABLATION (Open Question 13).
#
# Single-variable follow-up to finetune_vae_whole_structure_baseline.yaml
# (0.3x encoder LR, val_vrmse 0.08516, job 521887). Every run in this ledger
# so far has trained against the fixed weighted sum rmse*1.0 + h1*50.0 +
# ssim*0.15 + mlw*0.0 -- the "loss-weight axis is exhausted" finding
# (EXPERIMENTS.md "Established") only ever perturbed the *magnitude* of
# these weights (h1 25->50, mlw 0->1e-4) and always landed in a 2% band. It
# never tried the boundary case: h1 and ssim at exactly 0, i.e. training on
# rmse alone. h1's weight (50.0) is by far the largest coefficient in the
# sum, so this has never actually been ablated to zero.
#
# THE QUESTION: does the weighted h1 + ssim regularization help or hurt
# val_vrmse (itself an RMSE-family metric, see windinet/losses/vrms.py) --
# or is it neutral, consistent with "the axis is exhausted"? A plain-RMSE
# objective might score BETTER on val_vrmse precisely because it isn't
# spending gradient on smoothness (h1) or structural similarity (ssim)
# instead of amplitude accuracy -- or it might score worse if those terms
# are acting as real regularizers against overfitting the training set's
# high-frequency noise. Either way this is a result nobody has, not an
# expected direction.
#
# SINGLE VARIABLE vs finetune_vae_whole_structure_baseline.yaml:
#   loss_weighting.weights.h1:   50.0 -> 0.0
#   loss_weighting.weights.ssim:  0.15 -> 0.0
# mlw was already 0.0. Treated as ONE conceptual variable ("which loss
# terms are active") per protocol point 1, not two separate sweeps --
# zeroing only one of h1/ssim while leaving the other active would still
# leave a compound multi-term objective and not answer "is rmse alone
# enough," which is the actual question here. Everything else (encoder_tail
# _lr_multiplier 0.3x, seed 42, 15 epochs, wsd, whole encoder trunk
# unfrozen, normalization_stats_file) UNCHANGED.
#
# READ-OUT: compare epoch-15 val_vrmse to the baseline's 0.08516 (job
# 521887), against the ~1.1% seed-noise floor (Open Question 1). Also check
# val_rmse/train_rmse directly (metrics.csv logs each component
# unconditionally regardless of its weight, see windinet/training/
# vae_trainer.py) and the reconstruction panels specifically for
# oversmoothing or spurious high-frequency artifacts at shock
# discontinuities -- h1 is what was suppressing exactly that failure mode,
# see "The bandwidth ceiling" in EXPERIMENTS.md, so a val_vrmse win here
# needs a qualitative check before being read as a strict improvement.
#
# KILL CRITERION: usual (epoch 2 train_loss above epoch 1's). No elevated
# divergence risk expected from removing loss terms -- if anything, a
# smaller effective loss magnitude (no h1 term contributing at weight 50)
# only shrinks the gradient the optimizer sees, but max_grad_norm clipping
# is unchanged and unaffected either way.
#
# Usage:
#   sbatch jobs/sng_pvc/finetune_vae.sbatch configs/finetune_vae/finetune_vae_whole_structure_baseline_rmseonly.yaml
#   sbatch jobs/lundquist/finetune_vae_2gpu.sbatch configs/finetune_vae/finetune_vae_whole_structure_baseline_rmseonly.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "mean"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0
  # Whole-structure unfreeze, unchanged from the baseline.
  unfreeze_down_blocks: [0, 1, 2]
  unfreeze_encoder_tail: true

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  # Unchanged from the baseline.
  learning_rate: 5e-5
  adapter_lr_multiplier: 1.0
  encoder_tail_lr_multiplier: 0.3
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 15
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    # THE variable: rmse is the only nonzero term. h1 50.0 -> 0.0, ssim
    # 0.15 -> 0.0. mlw was already 0.0 in the baseline.
    rmse: 1.0
    h1: 0.0
    ssim: 0.0
    mlw: 0.0

loss:
  # Inert while h1/ssim/mlw are all 0, but kept in the schema for parity
  # with every other config -- these fields are only consumed by loss
  # functions whose weight is nonzero.
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "wsd", "15ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "rmse-only"]

seed: 42
# Distinct from every other output_dir in this project -- clean_output_dir
# wipes the target at startup, reusing a name is how baseline #3 was lost
# once already (see EXPERIMENTS.md protocol point 6).
output_dir: "finetune_vae_whole_structure_baseline_rmseonly"
clean_output_dir: true
