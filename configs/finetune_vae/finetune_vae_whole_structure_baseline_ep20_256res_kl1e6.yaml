# VAE finetuning config -- 20-epoch budget variant of the 256x256 KL-weight
# sweep, arm 3/4 (kl=1e-6). See finetune_vae_whole_structure_baseline_ep20_256res.yaml
# (arm 1/4, the reference) for the full "why 20 epochs" rationale -- this
# file's only difference from that one is loss_weighting.weights.kl.
#
# SINGLE VARIABLE vs finetune_vae_whole_structure_baseline_ep20_256res.yaml:
#   loss_weighting.weights.kl: unset (0.0) -> 1.0e-6
#
# BATCH_SIZE=4 (uniform across this whole 2026-08-20 plan, user preference
# for memory headroom over speed): the ep30 sibling of this exact config
# (kl=1e-6) did run cleanly through epoch 29/30 at BATCH_SIZE=16 with no
# OOM (job 5750943), so 16 would likely also be safe here -- but kept at 4
# to match every other arm in this plan rather than mixing batch sizes
# across siblings.
#
# Usage:
#   BATCH_SIZE=4 sbatch --time=15:00:00 jobs/lrz_ai/finetune_vae_2gpu.job \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep20_256res_kl1e6.yaml \
#       /dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  # Placeholder -- overridden at launch by jobs/lrz_ai/*.job's DATA_DIR
  # argument (see Usage above). Only meaningful if this config is ever run
  # through a launcher that does NOT override data_root.
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0
    # THE variable: unset (0.0) -> 1e-6. Sweep arm 3/4, see header.
    kl: 1.0e-6

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "wsd", "20ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "256res", "kl-divergence", "kl-sweep"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep20_256res_kl1e6"
clean_output_dir: true
