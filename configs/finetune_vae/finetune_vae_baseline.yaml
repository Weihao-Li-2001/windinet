# Baseline VAE finetuning config for the ShockWave CFD adapter.
#
# Task: finetune the LTX-Video VAE decoder (+ encoder.conv_in) on 4-channel
# CFD fields (density, momentum_x, momentum_y, pressure), inflate mode with
# mean-init channel seeding.
#
# Key settings:
#   - adapter.mode "inflate" + inflate_init "mean": grow conv_in/conv_out to
#     4 native channels, seeding the new channel with the mean of the
#     pretrained RGB slots (see windinet/vae_adapter.py).
#   - optimization.adapter_lr_multiplier 1.0: encoder.conv_in trains at the
#     same LR as the decoder (5e-5), no special-cased fast group.
#   - optimization.scheduler_type "wsd" with stable_fraction 0.7: warmup ->
#     70% of post-warmup steps held at peak LR -> cosine decay to the floor.
#   - loss_weighting.weights.h1 50.0: elevated H1 (gradient) loss weight,
#     targeting sharper shock/vortex boundary reconstruction.
#   - 15 epochs, gradient_accumulation_steps 8 (paired with --num_processes 4
#     for an effective batch of 32 -- the sbatch scripts patch this together
#     for other GPU/tile counts, keeping the effective batch fixed).
#
# Result: val_vrmse 0.095396 (see EXPERIMENTS.md for the full ledger).
#
# The latent space still moves: freeze_conv_in is false, so encoder.conv_in
# trains. Latents from preprocess_dataset.py must be re-encoded before any
# DiT training on a checkpoint from this config -- inference_shockwave.py's
# fingerprint check refuses a mismatched pairing rather than emitting wrong
# physics silently.
#
# Usage:
#   sbatch jobs/lundquist/finetune_vae_4gpu.sbatch configs/finetune_vae/finetune_vae_baseline.yaml
#   sbatch jobs/sng_pvc/finetune_vae.sbatch configs/finetune_vae/finetune_vae_baseline.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  # Carried over from 21623: mean beat zeros/random on every prior ablation.
  inflate_init: "mean"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  # Was inline channel_mean/channel_std -- switched 2026-08-08 to load from
  # the canonical per-resolution stats file instead (see VaeDataConfig.
  # normalization_stats_file), same numbers, single source of truth.
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  # Same 675 eval sims as every prior run (same seed + randperm), so val_vrmse
  # is measured on exactly the same simulations.
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  # 1.0: encoder.conv_in trains at the same LR as the decoder (see header).
  adapter_lr_multiplier: 1.0
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 15
  batch_size: 1
  # 4 GPUs: overridden to 8 by the sbatch wrapper anyway, kept here so a bare
  # `accelerate launch --num_processes 4` matches. CHANGE THIS TOGETHER WITH
  # --num_processes, never one alone -- it sets both the effective batch and
  # steps_per_epoch, and therefore the LR horizon.
  gradient_accumulation_steps: 8
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "wsd", "15ep", "h1x2", "lr1x", "shockwave-cfd"]

seed: 42
# clean_output_dir wipes this directory at the start of each run -- don't
# point it at a directory whose contents you want to keep.
output_dir: "finetune_vae_baseline"
clean_output_dir: true
