# VAE finetuning config -- lundquist/128x128 SDS weight-sweep arm, upper
# bracket (w=1.0), against the UNTRAINED critic (same critic choice as
# finetune_vae_whole_structure_baseline_ep20_sds_untrained.yaml, the w=0.1
# arm that actually finished on lundquist -- job 22759). SINGLE VARIABLE vs
# that file: loss_weighting.weights.sds only, 0.1 -> 1.0 (10x). Everything
# else (resolution, cosine schedule, peak LR, adapter, untrained_dit=true,
# the other four loss weights) UNCHANGED, so this stays directly comparable
# to the w=0.1 arm and to its w=0.01 sibling
# (finetune_vae_whole_structure_baseline_ep20_sds_w0p01.yaml).
#
# WHY untrained_dit, not the trained-critic checkpoint: see
# windinet.config.SdsLossConfig's docstring -- a DiT already finetuned on
# THIS project's own VAE latents is, by construction, a critic tuned to that
# VAE's own quirks, so using it to reshape a new VAE risks just reproducing
# the old latent space's statistics rather than testing against a
# task-independent prior. The stock/untrained transformer avoids that
# circularity. This is the deliberate choice for this sweep -- do NOT swap
# in sds.dit_checkpoint here.
#
# WHAT THIS TESTS: the w=0.1 untrained-critic arm's own weight was never
# swept, just a first guess (same as the trained-critic arm's). This arm
# (w=1.0) and its w=0.01 sibling bracket it by one decade each way,
# mirroring the log-spacing already used for the kl1e5/kl1e6/kl1e7 sweep, to
# find out whether w=0.1 sits near a sweet spot or whether more/less SDS
# pressure keeps helping.
#
# NOTE: needs NO local DiT checkpoint file on lundquist -- untrained_dit=true
# loads the stock pretrained transformer via load_transformer(model_source),
# same as every other config's model.model_source. No scp/BLOCKER step
# required (unlike the trained-critic sweep arms).
#
# Usage:
#   sbatch jobs/lundquist/finetune_vae_2gpu.sbatch \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep20_sds_w1.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0
    # THE variable vs the w=0.1 untrained-critic arm -- see header. Upper
    # bracket, 10x the untuned first guess.
    sds: 1.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

# THE other half of the variable above -- see header for the full rationale
# and windinet/config.py's SdsLossConfig for every field's meaning.
sds:
  enabled: true
  untrained_dit: true
  model_source: "LTXV_2B_0.9.6_DEV"
  scalar_conditioning:
    enabled: true
    scalar_names: ["gamma"]
    scalar_ranges:
      gamma: [1.0, 2.0]
    embedding_dim: 4096
    num_tokens_per_scalar: 4
    fourier_features: 64
    mlp_hidden_dim: 256
    dropout: 0.1
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "128res", "kl-sds-sweep", "sds", "untrained-critic", "sds-weight-sweep", "sds-w1"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep20_sds_w1"
clean_output_dir: true
