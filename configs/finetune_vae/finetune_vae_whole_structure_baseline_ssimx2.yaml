# VAE finetuning config -- ssim WEIGHT 0.15 -> 0.3, the FIRST time ssim's
# own weight has ever been independently swept (Open Question 17).
#
# THE QUESTION: unlike h1 (25 -> 50 sweep) and mlw (0 -> 1e-4 sweep),
# ssim's weight (0.15) has never been an experimental variable on its own
# in this ledger -- it was set once, at the very first baseline, and only
# ever moved to 0.0 as part of Open Question 13's compound "zero both h1
# and ssim" ablation (which answered "does removing both help/hurt," not
# "what is ssim's own weight doing"). Does doubling it change val_vrmse,
# and does it change the qualitative failure mode (h1/ssim together are
# what suppress oversmoothing/artifacts at shocks, per "The bandwidth
# ceiling" and Open Question 13's panel-check note)?
#
# SINGLE VARIABLE vs finetune_vae_whole_structure_baseline.yaml (18
# epochs, 0.3x encoder LR, whole-structure unfreeze):
#   loss_weighting.weights.ssim:  0.15 -> 0.3
# Everything else UNCHANGED.
#
# READ-OUT: compare epoch-18 val_vrmse to the reconfirmed baseline's
# ~0.0834, against the ~1.1% seed-noise floor (Open Question 1).
#
# KILL CRITERION: usual (epoch 2 train_loss above epoch 1's). Low risk --
# ssim's weight (0.15) is by far the smallest of the three active
# coefficients even after doubling (0.3 vs h1's 50.0), so this shifts the
# balance far less than the h1x2 arm does.
#
# Usage:
#   sbatch jobs/sng_pvc/finetune_vae.sbatch configs/finetune_vae/finetune_vae_whole_structure_baseline_ssimx2.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "mean"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0
  unfreeze_down_blocks: [0, 1, 2]
  unfreeze_encoder_tail: true

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  adapter_lr_multiplier: 1.0
  encoder_tail_lr_multiplier: 0.3
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 18
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    # THE variable: 0.15 -> 0.3.
    ssim: 0.3
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "wsd", "18ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "ssimx2"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ssimx2"
clean_output_dir: true
