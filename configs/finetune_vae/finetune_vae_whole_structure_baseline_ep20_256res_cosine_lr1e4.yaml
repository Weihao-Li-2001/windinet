# VAE finetuning config -- cosine-schedule sub-sweep at 256res/20ep/no-KL,
# arm 2/3 (peak LR 1e-4, 2x the baseline's 5e-5). See
# finetune_vae_whole_structure_baseline_ep20_256res_cosine_lr5e5.yaml (arm
# 1/3, the reference) for the full "why re-test cosine" rationale -- this
# file's only difference from that one is optimization.learning_rate.
#
# WHY THIS ARM: cosine's known weakness (vs wsd, at matched peak LR) is
# spending less of the training budget at/near peak LR -- it starts
# decaying immediately after warmup instead of holding a plateau. A higher
# peak LR is the direct lever to compensate: more signal per step during
# cosine's shorter effective high-LR window. 1e-4 is untested anywhere in
# this project's ledger (every prior VAE arm uses 5e-5) -- this is the
# upper end of the 3-point sweep (5e-5, 1e-4 here, 1e-5 in the third arm).
#
# SINGLE VARIABLE vs finetune_vae_whole_structure_baseline_ep20_256res_cosine_lr5e5.yaml:
#   optimization.learning_rate: 5e-5 -> 1e-4
#
# RISK: this is the least-tested corner of the sweep -- 2x the highest peak
# LR ever used in this project, on a schedule (cosine) that starts
# decaying immediately (so it never sustains 1e-4 for long, but the first
# few hundred steps post-warmup are the hottest LR this codebase has run).
# Watch epoch 1-2 train_loss closely: the usual kill criterion (epoch 2
# train_loss above epoch 1's) applies with no extra latitude here, unlike
# the KL-sweep arms' logvar-clamp blip allowance -- a bad start at this LR
# is a real instability signal, not a known-benign artifact.
#
# BATCH_SIZE=4, --time=15:00:00: same convention as every other 256res arm
# in EXPERIMENTS.md's 2026-08-20 plan.
#
# Usage:
#   BATCH_SIZE=4 sbatch --time=15:00:00 jobs/lrz_ai/finetune_vae_2gpu.job \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep20_256res_cosine_lr1e4.yaml \
#       /dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  # Placeholder -- overridden at launch by jobs/lrz_ai/*.job's DATA_DIR
  # argument (see Usage above). Only meaningful if this config is ever run
  # through a launcher that does NOT override data_root.
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  # THE variable: 5e-5 -> 1e-4. Sweep arm 2/3, see header.
  learning_rate: 1e-4
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "lr2x", "shockwave-cfd", "whole-structure-baseline", "256res", "schedule-shape", "lr-sweep"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep20_256res_cosine_lr1e4"
clean_output_dir: true
