# VAE finetuning config -- cosine-schedule sub-sweep at 256res/20ep/no-KL,
# arm 1/3 (peak LR unchanged at 5e-5, the reference for this sub-sweep).
# Forked from finetune_vae_whole_structure_baseline_ep20_256res.yaml (the
# Experiment 2 kl=0 reference, wsd schedule) -- see that file's own header
# for the "why 20 epochs" rationale, unchanged here.
#
# WHY RE-TEST COSINE (2026-08-20): cosine already lost decisively once,
# `finetune_vae_whole_structure_baseline_ep30_cosine.yaml` (archived,
# job 524309) at 128res/ep30/same 5e-5 peak LR: +3.64% vs wsd, a real
# regression clearing the 2.2% noise bar (see EXPERIMENTS_archive.md's
# "Epoch budget / schedule-shape sweep" section). Root cause identified
# there, not just correlation: wsd holds flat at peak LR through epoch 21
# (`stable_fraction 0.7` of 30), cosine starts decaying immediately after
# warmup and is already down to 1.46e-05 by epoch 20 -- cosine simply
# spends far less of the budget at/near peak LR. This file's sub-sweep
# (siblings _lr1e4.yaml, _lr1e5.yaml) tests whether a HIGHER peak LR can
# compensate for that shorter effective high-LR window -- a genuinely
# different question from "does cosine beat wsd at the same peak LR",
# which is already answered (no). This arm (same 5e-5 peak) is the
# same-LR wsd-vs-cosine isolation, now at 256res/20ep/no-KL instead of the
# original 128res/30ep -- re-derives whether the earlier verdict still
# holds in this regime before trusting the higher-LR arms' comparison
# against it.
#
# SINGLE VARIABLE vs finetune_vae_whole_structure_baseline_ep20_256res.yaml:
#   optimization.scheduler_type: "wsd" -> "cosine"
#   (stable_fraction dropped: unused by the cosine branch in
#   windinet/training/vae_trainer.py -- `stable_steps = 0` regardless of its
#   value, see that file's scheduler-construction code)
# Everything else (learning_rate 5e-5, min_learning_rate 1e-6, epochs 20,
# resolution, loss weights, inflate_init) UNCHANGED.
#
# READ-OUT: val_vrmse vs finetune_vae_whole_structure_baseline_ep20_256res.yaml
# (this sub-sweep's wsd reference), bar 2.2% (2x seed noise floor). Also the
# reference point the _lr1e4/_lr1e5 siblings are read against to isolate
# peak-LR's own effect under cosine specifically.
#
# BATCH_SIZE=4, --time=15:00:00: same convention as every other 256res arm
# in EXPERIMENTS.md's 2026-08-20 plan (headroom over speed; ~8-8.7h
# estimated at BATCH_SIZE=16's pace for 20 epochs, this run is somewhat
# slower).
#
# Usage:
#   BATCH_SIZE=4 sbatch --time=15:00:00 jobs/lrz_ai/finetune_vae_2gpu.job \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep20_256res_cosine_lr5e5.yaml \
#       /dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  # Placeholder -- overridden at launch by jobs/lrz_ai/*.job's DATA_DIR
  # argument (see Usage above). Only meaningful if this config is ever run
  # through a launcher that does NOT override data_root.
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1
  save_epochs: [15]  # advisor requested: always keep epoch 15's weights regardless of best/last pruning

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "256res", "schedule-shape", "lr-sweep"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep20_256res_cosine_lr5e5"
clean_output_dir: true
