# VAE finetuning config -- 512x512_orig (Open Question 4, latent bandwidth /
# input resolution, continued) under the CURRENT whole-structure baseline
# conventions, not the stale ones the pre-existing
# finetune_vae_whole_structure_baseline_512res.yaml carries (that file was
# forked from the old ep18/mean-init baseline back on 2026-08-16 and then
# deprioritized before ever being updated -- inflate_init="mean", epochs=18,
# no KL sweep alignment). This file instead mirrors
# finetune_vae_whole_structure_baseline_ep20_256res.yaml (the current
# 256res/20ep/kl=0 reference): same inflate_init="zeros", same LR/schedule/
# loss weights, same 20-epoch budget -- only the resolution (and therefore
# data_root/normalization_stats_file) differs.
#
# SINGLE VARIABLE vs finetune_vae_whole_structure_baseline_ep20_256res.yaml:
#   data.data_root: 256x256_ds -> 512x512_orig
# Everything else (inflate_init, LR, wsd schedule, epochs=20, loss weights,
# no KL) UNCHANGED.
#
# NO 512-RESOLUTION CHANNEL STATS EXIST (scripts/compute_channel_stats.py has
# never been run against 512x512_orig/train.h5) -- normalization_stats_file
# below reuses euler_mq_256_only_train.yaml (256-resolution stats) as an
# approximation, per the same explicit instruction the pre-existing 512res
# config already carries (same underlying Euler_MQ sims, just resampled --
# almost certainly close, not verified for 512 specifically). If val_vrmse
# looks off relative to the 256res baseline, compute real 512 stats and diff
# before assuming it's a modeling problem.
#
# TWO-SEGMENT PLAN (2026-09-03): job 5767882 (this config pre-fix, accum=16)
# ran 12h and completed 14 clean epochs before its time-limit kill -- from
# its own per-epoch timing log lines (train=2546-2712s + eval=370s +
# ckpt=17.5s + viz~44s/4th-epoch), ~3000s/epoch. Note the accum 16->8 fix
# above does NOT change this: VaeTrainer.train() stops at a fixed epoch
# count, not a fixed step count (unlike the DiT trainer), so one epoch is
# always one full dataset pass regardless of how many micro-steps accum
# groups it into -- accum only fixes effective_batch, not wall-clock. 20
# epochs @ ~3000s/epoch ~= 16.7h total, split into two ~10h segments (each
# ~20% buffer over the 10-epoch/8.3h half): segment 1 is this file as-is
# (fresh start, epochs 1-10); segment 2 is
# finetune_vae_whole_structure_baseline_ep20_512res_resume.yaml (epochs
# 11-20, resume_from segment 1's last checkpoint).
#
# BATCH_SIZE env var correction (2026-09-03): the note this header used to
# carry ("jobs/lrz_ai/finetune_vae_4gpu.job's own BATCH_SIZE env var, default
# 4") was wrong -- only finetune_vae_2gpu.job has a BATCH_SIZE override;
# finetune_vae_4gpu.job has no such env var, so job 5767882 actually ran at
# this file's own hardcoded optimization.batch_size: 1 (confirmed by that
# job's own printed config table), not "4".
#
# EFFECTIVE-BATCH FIX (2026-09-03): this file was copied unchanged from
# finetune_vae_whole_structure_baseline_ep20_256res.yaml, which is a 2-GPU
# config (jobs 5757480/5757489, windinet_2gpu) -- batch_size=1 x accum=16 x
# 2 GPUs = effective_batch 32. Launched here via finetune_vae_4gpu.job (4
# GPUs) with the same accum=16, job 5767882 actually ran at effective_batch
# 1*16*4=64 -- the same doubling bug found and fixed in
# configs/dit/train_dit_lrz_ai.yaml's 4-GPU config. gradient_accumulation_steps
# dropped 16 -> 8 below to restore effective_batch=32. Job 5767882 (killed by
# the 12h time limit at epoch 15/20, see logs/lrz_ai/5767882-windinet_4gpu.out)
# is NOT to be resumed -- its progress belongs to the wrong-effective-batch
# schedule; restart this arm from step 0 under the corrected config instead.
#
# Usage (segment 1/2, epochs 1-10 -- see TWO-SEGMENT PLAN above):
#   sbatch --time=10:00:00 jobs/lrz_ai/finetune_vae_4gpu.job \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep20_512res.yaml \
#       /dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/512x512_orig

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  # Placeholder -- overridden at launch by jobs/lrz_ai/*.job's DATA_DIR
  # argument (see Usage above). Only meaningful if this config is ever run
  # through a launcher that does NOT override data_root.
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/512x512_orig/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 20
  batch_size: 1
  # 16 -> 8 (2026-09-03): restores effective_batch = 1*8*4 = 32 on this
  # file's actual 4-GPU launcher -- see header's "EFFECTIVE-BATCH FIX" note.
  gradient_accumulation_steps: 8
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "wsd", "20ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "512res", "4gpu"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep20_512res"
clean_output_dir: true
