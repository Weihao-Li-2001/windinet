# VAE finetuning config -- epoch budget 18 -> 30 AND a lower LR floor
# (Open Question 20c, EXPERIMENTS.md). PhD-advisor-requested alongside
# `_ep30.yaml` and `_ep30_slowdecay.yaml` -- see `_ep30.yaml`'s header for
# the epoch-budget rationale (Open Question 7's still-improving epoch-18
# trend). This one additionally lowers where the cosine decay bottoms out,
# not the shape of the decay curve itself.
#
# WHY: at `min_learning_rate: 1e-6` (floor = 2% of the 5e-5 peak), the
# last ~10% of the decay phase moves the LR very little in absolute terms
# but the model was still (slowly) improving at epoch 18 (Open Question
# 7: -0.4% ep17->18, not fully flat). A floor an order of magnitude lower
# gives the tail of the schedule more room to keep making small
# corrections instead of asymptoting at 1e-6 while loss is still moving.
#
# SINGLE VARIABLE (chained, 2 tags per protocol point 4) vs
# `finetune_vae_whole_structure_baseline_ep30.yaml`:
#   optimization.min_learning_rate: 1e-6 -> 1e-7
# vs the 18-epoch baseline (0.08360, job 523577), TWO variables move
# together (epochs + floor) -- compare against `_ep30.yaml`'s own result
# (isolates epoch count alone) for clean attribution to the lower floor
# specifically.
# Everything else UNCHANGED, including `stable_fraction` (0.7, same as
# `_ep30.yaml` -- the decay phase's *share* of the schedule is identical
# between these two configs, only how far down it anneals differs).
# Resolved schedule: 3600 total opt steps, 200 warmup, 2380 stable + 1020
# anneal (same split as `_ep30.yaml`), floor 1e-7 (0.2% of peak, vs
# `_ep30.yaml`'s 2%).
#
# READ-OUT: compare epoch-30 val_vrmse against BOTH the 18-epoch baseline
# (0.08360) and `_ep30.yaml`'s own result. Beating `_ep30.yaml` by >2.2%
# (2x the ~1.1% seed noise floor per protocol point 3) would show the
# 1e-6 floor was cutting off real, if slow, remaining improvement.
#
# KILL CRITERION: usual (epoch 2 train_loss above epoch 1's). Watch the
# last ~3-4 epochs specifically for `train_loss` oscillating rather than
# still (slowly) decreasing -- a lower floor without enough remaining
# steps to use it productively would show up there first, though at 1020
# anneal steps (same as `_ep30.yaml`) there is no reason to expect this.
# Same wall-clock cost as `_ep30.yaml` (~11h estimated) -- no stricter
# criterion needed.
#
# Usage:
#   sbatch jobs/sng_pvc/finetune_vae.sbatch configs/finetune_vae/finetune_vae_whole_structure_baseline_ep30_lowfloor.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "mean"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0
  unfreeze_down_blocks: [0, 1, 2]
  unfreeze_encoder_tail: true

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  adapter_lr_multiplier: 1.0
  encoder_tail_lr_multiplier: 0.3
  min_learning_rate: 1e-7
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 30
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "wsd", "30ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "epoch-budget", "lowfloor"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep30_lowfloor"
clean_output_dir: true
