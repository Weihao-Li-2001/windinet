# VAE finetuning config -- 20-epoch budget variant of the 256x256 KL-weight
# sweep, arm 1/4 (kl=0, the reference). Sibling arms: _kl1e7.yaml (arm 2/4),
# _kl1e6.yaml (arm 3/4), _kl1e5.yaml (arm 4/4) -- this file's own epoch
# count is the only difference across the 20ep family vs its 30ep
# counterpart (finetune_vae_whole_structure_baseline_ep30_256res.yaml).
#
# WHY 20 EPOCHS: the ep30 256res sweep measured ~12-13h/arm at BATCH_SIZE=16
# (anchor run's real ~24-26 min/epoch x 30, see EXPERIMENTS.md's 2026-08-20
# update) -- over a 10h Slurm request. This family exists to get a clean,
# resume-free KL-weight comparison at 256res inside a 10h budget, at the
# cost of a shorter epoch budget than the current baseline.
#
# SINGLE VARIABLE vs finetune_vae_whole_structure_baseline_ep30_256res.yaml:
#   optimization.epochs: 30 -> 20
# Everything else (resolution, LR, schedule, loss weights, inflate_init)
# UNCHANGED.
#
# BATCH_SIZE=4 (NOT 16): the ep30 sibling of this exact config (kl=0)
# confirmed OOM at BATCH_SIZE=16 in epoch 2 (job 5750941). Memory footprint
# doesn't depend on epoch count, so the same risk applies here -- use the
# job script's own default (4), do not override to 16.
#
# TIME: ~24-26 min/epoch at BATCH_SIZE=16 (anchor run's measured rate) x 20
# epochs ~= 8-8.7h; BATCH_SIZE=4 is somewhat slower (no confirmed 256res
# number for it yet) -- request 15h (2026-08-20 user preference, margin
# over the 8-8.7h estimate) rather than cutting it close at 10h.
#
# Usage:
#   BATCH_SIZE=4 sbatch --time=15:00:00 jobs/lrz_ai/finetune_vae_2gpu.job \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep20_256res.yaml \
#       /dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  # Placeholder -- overridden at launch by jobs/lrz_ai/*.job's DATA_DIR
  # argument (see Usage above). Only meaningful if this config is ever run
  # through a launcher that does NOT override data_root.
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1
  save_epochs: [15]  # advisor requested: always keep epoch 15's weights regardless of best/last pruning

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "wsd", "20ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "256res", "kl-sweep"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep20_256res"
clean_output_dir: true
