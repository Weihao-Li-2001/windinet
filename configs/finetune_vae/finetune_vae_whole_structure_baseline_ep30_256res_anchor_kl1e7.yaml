# Latent-distribution anchor-loss experiment, KL arm 2/2 (kl=1e-7). Forked
# from finetune_vae_whole_structure_baseline_ep30_256res_anchor.yaml (arm
# 1/2, kl=0, the reference -- COMPLETED all 30 epochs via resume job
# 5752185, val_vrmse 0.054342, see EXPERIMENTS.md). See that file's own
# header for the anchor-loss rationale (latent_space_shift_measure.md,
# PhD-advisor-sourced protocol) -- unchanged here.
#
# SINGLE VARIABLE vs finetune_vae_whole_structure_baseline_ep30_256res_anchor.yaml:
#   loss_weighting.weights.kl: unset (0.0) -> 1.0e-7
# Everything else (anchor weight 1e-2, resolution, epochs, LR, schedule,
# other loss weights, inflate_init) UNCHANGED.
#
# WHY THIS ARM: tests whether the anchor loss (which already pulls the
# latent distribution back toward the pretrained envelope via moment-
# matching/decorrelation) and a small explicit KL weight interact --
# either redundantly (KL adds nothing once anchor is active) or
# usefully (KL's per-dimension calibration complements anchor's
# distributional regularizer). kl=1e-7 chosen as the smallest of the
# 256res KL-sweep's tested points (Open Questions 19/22 already found KL
# "free" up to ~1e-6 without anchor) rather than re-sweeping the full
# range on top of anchor in a first pass.
#
# BATCH_SIZE=4 (uniform across this whole 2026-08-20 plan, user preference
# for memory headroom over speed): the kl=0 anchor arm did run cleanly
# through all 30 epochs (initial run + one resume) at BATCH_SIZE=16 with no
# OOM (jobs 5752185 and its predecessor), so 16 would likely also be safe
# here -- but kept at 4 to match every other arm in this plan rather than
# mixing batch sizes across siblings.
#
# TIME: anchor kl=0's own measured rate (~24-26 min/epoch at BATCH_SIZE=16)
# x 30 epochs ~= 12-13h at that batch size; BATCH_SIZE=4 is somewhat slower
# per infra.md's batch-size-vs-wall-clock findings (no confirmed 256res
# number for 4 specifically yet) -- requesting 15h (2026-08-20 user
# preference) instead of 10h to give this margin over the 12-13h baseline
# estimate, on top of the extra slack for BATCH_SIZE=4's slower pace.
#
# Usage:
#   BATCH_SIZE=4 sbatch --time=15:00:00 jobs/lrz_ai/finetune_vae_2gpu.job \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep30_256res_anchor_kl1e7.yaml \
#       /dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds
#
# After training, measure the latent shift the same way as the kl=0 anchor
# arm (scripts/latent_shift_metrics.py) to see whether adding KL moved the
# shift diagnostics further than anchor alone did.

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  # Placeholder -- overridden at launch by jobs/lrz_ai/*.job's DATA_DIR
  # argument (see Usage above). Only meaningful if this config is ever run
  # through a launcher that does NOT override data_root.
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 30
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0
    anchor: 1.0e-2
    # THE variable: unset (0.0, the anchor-only reference) -> 1e-7.
    kl: 1.0e-7

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1
  save_epochs: [15]  # advisor requested: always keep epoch 15's weights regardless of best/last pruning

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "wsd", "30ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "256res", "latent-anchor-loss", "kl-divergence"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep30_256res_anchor_kl1e7"
clean_output_dir: true
