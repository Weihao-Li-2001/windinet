# VAE finetuning config -- ENCODER LEARNING-RATE SWEEP, arm 3/3 (upper bound
# / stress test).
#
# Single-variable follow-up to finetune_vae_whole_structure_baseline.yaml
# (val_vrmse 0.08673 as `fullenc`, job 521389). See
# finetune_vae_whole_structure_baseline_enclr0p03x.yaml for the full
# rationale of this sweep and EXPERIMENTS.md Open Question 6 for the
# read-out / kill criteria -- not repeated here.
#
# CHANGE FROM finetune_vae_whole_structure_baseline.yaml:
# optimization.encoder_tail_lr_multiplier 0.1 -> 1.0 (absolute encoder LR
# 5e-6 -> 5e-5, EQUAL to the decoder LR). Everything else UNCHANGED.
#
# Grid position: log-spaced 4-point grid 0.03x / 0.1x (existing) / 0.3x / 1x.
# This is deliberately the aggressive end: `encoder_tail_lr_multiplier` was
# designed to be kept "below the decoder LR ... because these weights carry
# a pretrained basis instead of being freshly grown like encoder.conv_in"
# (windinet/config.py docstring) -- this arm removes that safety margin
# entirely and treats the encoder trunk the same as the decoder. Expected
# to be the most likely arm to destabilize the pretrained downsampling
# basis (same failure mode as `inflate_init: random`, EXPERIMENTS.md
# "Established" section: 0.162905 vs 0.094739, +72%). WATCH epoch
# 1-2 train_loss closely -- see kill criterion in EXPERIMENTS.md Open
# Question 6 before letting this run to completion.
#
# Usage:
#   sbatch jobs/sng_pvc/finetune_vae.sbatch configs/finetune_vae/finetune_vae_whole_structure_baseline_enclr1x.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "mean"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0
  unfreeze_down_blocks: [0, 1, 2]
  unfreeze_encoder_tail: true

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  channel_mean: [0.905097647712509, 0.0040453659499771295, -0.0019089379643528095, 0.9031908053899714]
  channel_std: [0.6607349375392083, 0.5328754120427532, 0.5262512462358824, 0.8050358917795326]
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  adapter_lr_multiplier: 1.0
  # THE variable in this run: 0.1 -> 1.0 (absolute encoder LR 5e-6 -> 5e-5,
  # equal to the decoder LR -- no safety margin left).
  encoder_tail_lr_multiplier: 1.0
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 15
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "wsd", "15ep", "h1x2", "lr1x", "shockwave-cfd", "whole-structure-baseline", "encoder-lr-sweep", "enclr1x"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_enclr1x"
clean_output_dir: true
