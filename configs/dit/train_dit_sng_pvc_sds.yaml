# ShockWaveNet (DiT) training config -- pairs with the SDS (score-distillation)
# VAE ablation arm (configs/finetune_vae/finetune_vae_whole_structure_baseline_
# ep20_256res_sds.yaml, jobs 535151/535182), preprocessed via job 535374 into
# dit_preprocessed/finetune_vae_whole_structure_baseline_ep20_256res_sds
# (normalization.json / split_manifest.json already committed under
# finetune_vae_outputs/sng_pvc/dit_preprocessed/... -- see that job's log).
#
# SDS only touches the VAE finetuning stage (distills a frozen DiT's
# flow-matching velocity back into the VAE encoder, see the VAE config's own
# header) -- this DiT training recipe is otherwise UNCHANGED from
# train_dit_sng_pvc_ep20_baseline.yaml (steps=8000, LR=1e-5,
# effective_batch=32): only preprocessed_data_root (at launch) and
# output_dir differ, so this arm is comparable to every other cosine/kl/
# baseline DiT arm on every axis except which VAE produced its latents.
#
# Usage:
#   sbatch jobs/sng_pvc/train_dit.sbatch \
#       finetune_vae_whole_structure_baseline_ep20_256res_sds \
#       configs/dit/train_dit_sng_pvc_sds.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "gamma"
  scalar_ranges:
    gamma: [1.0, 2.0]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 1e-5
  steps: 8000
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: false  # disabled, same reasoning as every sng_pvc DiT config since
  # 2026-09-07 (job 534853/534884: UR_RESULT_ERROR_OUT_OF_RESOURCES on ranks
  # 2-7 one step after the first visualization trigger). Re-enable once
  # root-caused; backfill PNG panels/VRMSE curve post-hoc against saved
  # checkpoints in the meantime.
  interval: 2000

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "sng_pvc", "256res", "sds-vae"]

seed: 42
output_dir: "$SCRATCH/windinet/outputs/shockwave_dit_sds"
