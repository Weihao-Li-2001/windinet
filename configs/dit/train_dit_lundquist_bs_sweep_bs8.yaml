# DiT (ShockWaveNet) 1-GPU batch_size throughput sweep, bs=8 arm -- lundquist.
#
# NOT for real training results. Purpose: submit this and its bs2/bs4/bs8
# siblings each for a fixed --time=02:00:00 wall-clock window (see
# jobs/lundquist/train_dit_1gpu.sbatch) and compare how many optimizer
# steps each batch_size reaches in that window -- a throughput/OOM-headroom
# read-out, same spirit as configs/train_dit_lrz_ai_baseline.yaml's
# still-unconfirmed batch_size=2/accum=8 change (2026-08-30): does raising
# batch_size (fewer, fatter steps) actually buy more steps/hour than many
# thin gradient-accumulation micro-steps?
#
# gradient_accumulation_steps is held at 1 across all four siblings so
# batch_size is the only thing that varies -- effective_batch = batch_size
# here (1/2/4/8), deliberately NOT held constant across the sweep, since the
# question being asked is "how fast is each batch_size", not "does a
# fixed-effective-batch reshuffle go faster" (that's the lrz_ai question).
#
# Based on configs/train_dit_lundquist_smoketest.yaml (same model/
# conditioning/acceleration blocks), but:
#   - num_dataloader_workers raised 0 -> 4 (smoketest's 0 is a debug choice
#     that would make the dataloader itself the bottleneck at higher batch
#     sizes, confounding the read-out) -- matches the lrz_ai production
#     configs' worker count.
#   - optimization.steps raised 10 -> 100000 so the 2h --time limit is what
#     stops the job, not hitting the step target early.
#   - checkpoints.interval raised 5 -> 500 so checkpoint I/O (safetensors
#     writes for a 2B-param transformer) doesn't eat into the 2h budget --
#     the step count you want is read straight from the training log
#     (last "step=" line / step counter), not from how many checkpoints
#     got written.
#
# Only preprocessed dataset on lundquist as of 2026-08-30 is
# dit_preprocessed/smoketest (24 train sims, 128x128 VAE latents, 224
# tokens) -- NOT the 256x256/896-token data the lrz_ai configs use, so
# these throughput numbers characterize relative batch_size scaling on
# lundquist's GPUs, not an exact 256res production estimate.
#
# Submit with (PREPROCESSED_NAME=smoketest, see train_dit_1gpu.sbatch header):
#   sbatch jobs/lundquist/train_dit_1gpu.sbatch smoketest configs/train_dit_lundquist_bs_sweep_bs8.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "gamma"
  scalar_ranges:
    gamma: [1.0, 2.0]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 1e-5
  steps: 100000
  batch_size: 8
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: null

checkpoints:
  interval: 500
  keep_last_n: 1

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["throughput-sweep", "lundquist", "1gpu", "bs8"]

seed: 42
output_dir: "dit_outputs/lundquist/dit_throughput_sweep_bs8"
