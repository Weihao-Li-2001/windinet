# ShockWaveNet (DiT) training config -- pairs with the COSINE-schedule VAE
# sweep's lr1e5 arm (finetune_vae_whole_structure_baseline_ep20_256res_
# cosine_lr1e5, job 529953, val_vrmse=0.065861, kl weight UNSET -- i.e. 0,
# same as ep20_baseline's own VAE). This is the missing control: every other
# cosine-schedule DiT arm so far (cosine_kl1e5/kl1e6/kl1e7, cosine_anchor)
# bundles the cosine LR schedule together with a nonzero KL/anchor
# regularization term, so a bad result can't be pinned on either variable
# alone. cosine_kl1e5 in particular came back badly broken (eval_dit_vrmse
# job 535373: vae_dit_vrmse=1.33 / latent_vrmse=5.48, WORSE than an
# untrained-DiT control) despite the lowest training loss seen on any arm --
# this config isolates whether the cosine schedule itself is implicated, or
# whether (as the low-loss-but-broken-rollout pattern suggests) it's
# specifically the KL/anchor regularization reshaping the VAE latent space
# in a way this DiT training recipe can't handle.
#
# Otherwise identical to train_dit_sng_pvc_ep20_baseline.yaml (steps=8000,
# LR=1e-5, effective_batch=32) and to cosine_kl1e5/cosine_anchor's own DiT
# configs -- only preprocessed_data_root (at launch) and output_dir differ,
# so this arm is comparable to all of them on every axis except which VAE
# produced its latents.

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "gamma"
  scalar_ranges:
    gamma: [1.0, 2.0]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 1e-5
  steps: 8000
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: false  # disabled, same reasoning as every sng_pvc DiT config since
  # 2026-09-07 (job 534853/534884: UR_RESULT_ERROR_OUT_OF_RESOURCES on ranks
  # 2-7 one step after the first visualization trigger). Re-enable once
  # root-caused; backfill PNG panels/VRMSE curve post-hoc against saved
  # checkpoints in the meantime.
  interval: 2000

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "sng_pvc", "256res", "cosine-vae", "kl-zero-control"]

seed: 42
output_dir: "$SCRATCH/windinet/outputs/shockwave_dit_cosine_lr1e5"
