# LR variant of train_dit_sng_pvc_ep20_baseline.yaml -- lower-LR arm of a
# bracket around that config's learning_rate: 1e-5 (3x down here, 3x up in
# the _lr3e5.yaml sibling). SINGLE VARIABLE: optimization.learning_rate,
# everything else (steps=8000, effective_batch=32, cosine schedule shape,
# scalar conditioning, VAE arm/preprocessed data root) UNCHANGED.
#
# Same usage pattern as train_dit_sng_pvc_ep20_baseline.yaml -- point
# jobs/sng_pvc/train_dit.sbatch's PREPROCESSED_NAME at
# finetune_vae_whole_structure_baseline_ep20_256res (this config only
# changes the LR, not which VAE arm it trains against).

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "gamma"
  scalar_ranges:
    gamma: [1.0, 2.0]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  # THE variable: 1e-5 -> 3e-6 (3x down from train_dit_sng_pvc_ep20_baseline.yaml).
  learning_rate: 3e-6
  steps: 8000
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: true
  interval: 2000

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "sng_pvc", "256res", "ep20_baseline", "lr-sweep", "lr3e6"]

seed: 42
output_dir: "$SCRATCH/windinet/outputs/shockwave_dit_ep20_baseline_lr3e6"
