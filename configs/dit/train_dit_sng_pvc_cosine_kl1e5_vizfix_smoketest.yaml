# Dedicated test copy of train_dit_sng_pvc_cosine_kl1e5.yaml -- NOT a new
# experiment arm, exists only to smoke-test the DitVisualizer fix
# (windinet/training/dit_visualization.py: gt_norm now gets padded to 8n+1
# via pad_frames_8n1 before being VAE-encoded) without burning ~1.5-2h of
# real training to find out whether it worked.
#
# Root cause it's testing: cosine_kl1e5/kl1e6/kl1e7 (jobs 534572/573/574,
# 2026-09-05) all crashed at step 2000 -- exactly visualization.interval,
# the first time DitVisualizer.run() fired -- with a VAE-decoder
# `unflatten` shape error, because the ground-truth video encoded there for
# the new per-step latent VRMSE metric was never padded to the LTX VAE's
# required 8n+1 frame count. Fixed 2026-09-06.
#
# SINGLE VARIABLE vs train_dit_sng_pvc_cosine_kl1e5.yaml:
#   visualization.interval: 2000 -> 10 (trigger the fixed code path almost
#     immediately instead of waiting ~2000 steps)
#   optimization.steps: 8000 -> 20 (just needs to clear step 10)
#   output_dir: distinct, so this doesn't touch the real kl1e5 arm's
#     checkpoints/output_dir
#   wandb.tags: added "vizfix-smoketest"
#
# Usage (test partition, 30 min cap is more than enough):
#   sbatch --time=00:20:00 --partition=test jobs/sng_pvc/train_dit.sbatch \
#       finetune_vae_whole_structure_baseline_ep20_256res_cosine_kl1e5 \
#       configs/dit/train_dit_sng_pvc_cosine_kl1e5_vizfix_smoketest.yaml
#
# PASS/FAIL: tail the job's .out -- a clean
#   "Saved DiT visualization panels for step 10 ... latent_vrmse=... pixel_vrmse=..."
# with no traceback in the .err means the fix works; a repeat of the
# `unflatten` RuntimeError means it doesn't. Either way this only costs a
# couple of minutes of compute, not a full run.
#
# Once confirmed, delete this config and its output_dir -- it has no
# further use, same convention as
# train_dit_sng_pvc_ep20_baseline_steps5000_test.yaml.

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "gamma"
  scalar_ranges:
    gamma: [1.0, 2.0]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 1e-5
  steps: 20
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: true
  interval: 10

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "sng_pvc", "256res", "cosine-vae", "kl1e5", "vizfix-smoketest"]

seed: 42
output_dir: "$SCRATCH/windinet/outputs/shockwave_dit_cosine_kl1e5_vizfix_smoketest"
