# ShockWaveNet (DiT) training config -- 128res/lundquist analogue of
# train_dit_sng_pvc_cosine_kl1e7.yaml, paired with the lundquist COSINE
# KL/SDS sweep's kl=0 arm (finetune_vae_whole_structure_baseline_ep20_kl0,
# preprocessed 2026-09-11, job 22742 -- see logs/lundquist/INDEX.tsv). This
# sweep moved to lundquist/128res because sng_pvc's GPU-hour budget ran out
# before its own cosine_lr1e5 control could confirm whether KL
# regularization or the cosine schedule itself was behind the broken
# cosine-schedule DiT-rollout results (job 535373/535882/535883); this arm
# is the kl=0 reference for that question, sibling to _kl1e7.yaml.
#
# steps=8000, LR=1e-5, cosine schedule: same convention as the sng_pvc
# ep20_baseline/cosine arms, for direct comparability.
#
# effective_batch=32 via batch_size=4, gradient_accumulation_steps=4, across
# lundquist's 2 GPUs (4*4*2=32).
#
# CORRECTED 2026-09-12 after job 22753 OOM'd at batch_size=8/accum=2 (step
# 120, "Tried to allocate 28.00 MiB ... 47.52/47.54 GiB in use" -- right on
# the edge). That choice extrapolated batch_size=8's safety from the 1-GPU
# throughput sweep (jobs 22507-22514, 2026-08-30), which never wrapped the
# model in DDP or ran with a real AdamW optimizer state resident for more
# than a few steps -- both add fixed per-GPU memory this 2B-param model
# apparently cannot spare on a 48GB A6000. In hindsight this ignored the
# codebase's own precedent: even lrz_ai's 80GB H100 at 256res (pricier than
# this 128res data) only risks batch_size=2 (train_dit_lrz_ai.yaml's own
# comment calls it "NOT a confirmed-safe combination"), and sng_pvc's
# 128GB/tile XPUs still use batch_size=1. batch_size=4 was comfortably
# non-crashing in the same 1-GPU sweep (no near-OOM signal, unlike bs8's
# razor-thin margin), so it's the safer pick here.
#
# Wall-clock: lundquist's debug partition has a **hard 12h kill** (see
# jobs/lundquist/train_dit.sbatch's note). The bs4/1-GPU sweep measured
# ~4863 micro-steps/2h; at accum=4 that extrapolates to ~13h for 8000
# optimizer steps -- close enough to the ceiling that a time-limit kill and
# one resume (checkpoints.interval=120, keep_last_n=2 below) may be needed
# to finish; see [[project_dit_stage2_multicluster]]'s resume-config
# playbook if so.
#
# GOTCHA (2026-09-12): job 22754 (the kl1e7 sibling) died separately at
# rendezvous (EADDRINUSE on port 29500) because it was submitted at the same
# instant as this arm and landed on the same node/GPUs (both jobs logged
# `gpus=0,1`) -- lundquist's debug partition does not appear to give
# multi-GPU jobs exclusive GPU isolation the way sng_pvc/lrz_ai's do.
# Submit this arm and its kl1e7 sibling ONE AT A TIME, not back-to-back --
# e.g. chain the second with `--dependency=afterany:<this-jobid>` so Slurm
# won't start it until this one has actually exited.
#
# Launched by jobs/lundquist/train_dit_2gpu.sbatch, which substitutes
# __PREPROCESSED_ROOT__ for dit_preprocessed/<PREPROCESSED_NAME>:
#   sbatch --time=12:00:00 jobs/lundquist/train_dit_2gpu.sbatch \
#       finetune_vae_whole_structure_baseline_ep20_kl0 \
#       configs/dit/train_dit_lundquist_cosine_kl0.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "gamma"
  scalar_ranges:
    gamma: [1.0, 2.0]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 1e-5
  steps: 8000
  batch_size: 4
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: true
  interval: 2000

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "lundquist", "128res", "cosine-vae", "kl0"]

seed: 42
output_dir: "dit_outputs/lundquist/dit_cosine_kl0"
