# Shockwave VAE -- mean init, 10 epochs. ONE variable changed against
# configs/finetune_vae_meaninit.yaml: min_learning_rate 1e-6 -> 1e-5.
#
# The literal "raise the floor" variant. Keeps the cosine shape and just lifts
# its endpoint from 2% to 20% of peak, which lifts the whole curve with it
# (lr_factor = floor + (1-floor)*cosine, so the floor is a ratio, not a clamp).
# Per-epoch LR (units of 1e-5):
#     floor 1e-6 (vae_meaninit)  4.96 4.68 4.18 3.50 2.72 1.93 1.20 0.61 0.23 0.10
#     floor 1e-5 (this run)      4.96 4.74 4.33 3.78 3.14 2.49 1.90 1.42 1.11 1.00
# Total learning budget goes 0.510 -> 0.596 of constant-peak (+17%), and the
# share spent in the last 3 epochs goes 5.6% -> 13.2%.
#
# KNOWN COST, ACCEPTED: this run never anneals. It ends at 1e-5, so the weights
# keep the noise of a mid-training LR and give up the end-of-training sharpening
# that a decay-to-floor buys. Expect the final val curve to be flatter but
# possibly noisier epoch to epoch; the epoch-10 number may not be the best one.
# configs/finetune_vae_wsd.yaml is the variant that buys the same extra budget
# (+64%) without that cost -- run this one only if the goal is specifically to
# isolate the floor as a variable.
#
# BASELINE to beat (outputs/vae_meaninit, same init / peak / seed 42):
#     epoch  1  val_vrmse 0.17542
#     epoch  2  val_vrmse 0.14226
#     epoch 10  val_vrmse 0.10177   val_total_loss 0.033606
#
# Usage (4 GPUs):
#   accelerate launch --num_processes 4 scripts/finetune_vae.py \
#       configs/finetune_vae_lrfloor.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "mean"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  channel_mean: [0.905097647712509, 0.0040453659499771295, -0.0019089379643528095, 0.9031908053899714]
  channel_std: [0.6607349375392083, 0.5328754120427532, 0.5262512462358824, 0.8050358917795326]
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  adapter_lr_multiplier: 10.0
  # THE ONE CHANGE. 1e-6 -> 1e-5, i.e. the cosine bottoms out at 20% of peak
  # instead of 2%.
  min_learning_rate: 1e-5
  scheduler_type: "cosine"
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 8
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 50
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 25.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "lr-floor", "shockwave-cfd"]

seed: 42
output_dir: "$SCRATCH/windinet/outputs/vae_lrfloor"
clean_output_dir: true
