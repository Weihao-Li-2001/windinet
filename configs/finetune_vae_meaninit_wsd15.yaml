# Shockwave VAE -- mean init on the 15-epoch WSD schedule. ONE variable changed
# against configs/finetune_vae_randinit.yaml (job 21621): inflate_init
# random -> mean. Everything else -- wsd/0.7, 15 epochs, warmup 200, peak 5e-5,
# min 1e-6, accum 8, seed 42, loss weights -- is held, so the total step count is
# the same 1800 and the LR curve is POINTWISE IDENTICAL to 21621's. The init is
# the only attributable difference.
#
# WHY: job 21621 (random init, this schedule) is not merely underfit, it lost.
#     epoch  1  val_vrmse 0.95467
#     epoch  3  val_vrmse 0.42227
#     epoch  7  val_vrmse 0.22300
#     epoch 11  val_vrmse 0.18773
#     epoch 13  val_vrmse 0.17183   (still -5..7%/epoch, but the anneal has begun)
# Compare the two inits that KEEP LTXV's pretrained conv_in / conv_out, both at
# only 10 epochs on the older cosine schedule:
#     outputs/vae_meaninit      (mean)   epoch 1 0.17542   epoch 10 0.10177
#     outputs/vae_inflate4_more (zeros)  epoch 1 0.18660   epoch 10 0.10489
#     outputs/vae_inflate4_tail3x (zeros) epoch 1 0.15182  epoch 10 0.10128
# Random init needed THIRTEEN epochs to reach what mean init reached in ONE.
# randinit's premise -- that LTXV's patchify basis, fitted to natural-image RGB,
# is a worse starting point than scaled noise for a shock front -- is falsified:
# encoder.conv_in is 221,312 params feeding a FROZEN 694M trunk, so relearning
# the projection from scratch consumes the entire budget as debt repayment.
# 21621's own diagnostics say the schedule is not the problem: val_total_loss
# stayed BELOW train_total_loss all 13 epochs (0.06281 vs 0.06481 at 13), no
# spikes, no plateau before the anneal. Not capacity, not LR, not regularization
# -- the starting point.
#
# THE SCHEDULE (unchanged, restated because the epoch boundaries matter):
#     4 GPUs x batch 1 x accum 8   -> effective batch 32, 120 opt steps/epoch
#     15 epochs                    -> 1800 total steps
#     warmup                       -> steps 0-200      (0.01x -> 1.0x)
#     stable, 0.7 x 1600           -> steps 200-1320   flat 5e-5, ends with epoch 11
#     cosine anneal                -> steps 1320-1800  5e-5 -> 1e-6, epochs 12-15
# Verified against 21621's log: epoch 11 closes at step 1320 with lr 5.00e-05 and
# epoch 12 starts decaying. WSD integrates to 0.838x the constant-peak budget vs
# cosine's 0.510x (see configs/finetune_vae_wsd.yaml header for that derivation),
# which is the lever this run is actually spending on mean init.
#
# WARMUP 200 IS INHERITED, NOT MOTIVATED. It exists because randinit's freshly
# randomized conv_in was hitting 5e-4 (10x adapter multiplier) after only 50
# steps. Mean init has no such fragility, so 200 of 1800 steps spent ramping is
# pure cost here -- kept anyway, because dropping it to 50 would change two
# variables and break attribution against 21621. If comparability against the
# meaninit/wsd line matters more than against 21621, use warmup_steps: 50 and say
# so; do not change both.
#
# RELATION TO configs/finetune_vae_wsd.yaml: that config is also mean + wsd 0.7 +
# 5e-5 and has NEVER BEEN RUN (outputs/vae_wsd does not exist). It differs only in
# epochs (10) and warmup_steps (50). It is left untouched because its header
# anchors its own 10-epoch comparison against vae_meaninit.
#
# KILL CRITERIA. 11 epochs at a flat 5e-5 is more high-LR exposure than mean init
# has ever had -- vae_meaninit only spent epochs 1-3 in the 4.2-5.0e-5 band. The
# peak itself is known-stable (lrscan_1.5e-4 diverged; 5e-5 did not), but if
#     epoch 1 val_vrmse > 0.1754   or   epoch 2 val_vrmse > 0.1423
# the plateau is too long for this init: kill the job and fall back to the
# 10-epoch configs/finetune_vae_wsd.yaml.
#
# NOTE ON THE LATENT SPACE: freeze_conv_in is false, so encoder.conv_in trains and
# the latent space MOVES. Latents from preprocess_dataset.py must be re-encoded
# before any DiT training on this checkpoint. The fingerprint check in
# inference_shockwave.py refuses a mismatched pairing rather than emitting wrong
# physics silently.
#
# output_dir is deliberately NOT outputs/vae_meaninit: clean_output_dir is true
# and would delete that run's 0.10177 baseline.
#
# Usage (4 GPUs):
#   sbatch scripts/finetune_vae_4gpu.sbatch configs/finetune_vae_meaninit_wsd15.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  # THE ONE CHANGE vs job 21621. Keep LTXV's pretrained conv_in / conv_out and
  # seed only the new (pressure) channel slot with the mean of the 3 pretrained
  # slots at the same patch position -- I3D-style. Pressure reaches the frozen
  # trunk from step 0, and the trunk still sees activations close to what it was
  # pretrained on.
  inflate_init: "mean"
  # False = encoder.conv_in trains. Under mean init this is a choice rather than
  # a necessity (unlike random init, where freezing would leave the trunk reading
  # permanent noise), but it is what every comparable run did.
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  channel_mean: [0.905097647712509, 0.0040453659499771295, -0.0019089379643528095, 0.9031908053899714]
  channel_std: [0.6607349375392083, 0.5328754120427532, 0.5262512462358824, 0.8050358917795326]
  normalization_clip: 5.0
  num_sim_frames: null
  # Same 675 eval sims as every prior run (same seed + randperm), so val_vrmse is
  # measured on exactly the same simulations.
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  # Every field below is identical to configs/finetune_vae_randinit.yaml.
  learning_rate: 5e-5
  adapter_lr_multiplier: 10.0
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 15
  batch_size: 1
  # 4 GPUs: overridden to 8 by the sbatch wrapper anyway, kept here so a bare
  # `accelerate launch --num_processes 4` matches. CHANGE THIS TOGETHER WITH
  # --num_processes, never one alone -- it sets both the effective batch and
  # steps_per_epoch, and therefore the LR horizon.
  gradient_accumulation_steps: 8
  max_grad_norm: 5.0
  weight_decay: 0.0
  # Inherited from randinit for attribution, not because mean init needs it --
  # see the header.
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  # Unchanged across the whole init family -- touching a weight would make both
  # val_total_loss comparisons and the init attribution meaningless.
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 25.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "wsd", "15ep", "shockwave-cfd"]

seed: 42
# NOT outputs/vae_meaninit -- clean_output_dir would wipe that baseline.
output_dir: "outputs/vae_meaninit_wsd15"
clean_output_dir: true
