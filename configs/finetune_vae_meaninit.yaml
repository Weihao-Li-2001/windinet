# Shockwave VAE -- from scratch, 10 epochs, cosine @ 5e-5. ONE variable changed
# against the zeros-init baseline (the retired finetune_vae_inflate_more.yaml,
# preserved as outputs/vae_inflate4_more/training_config.yaml):
# inflate_init zeros -> mean.
#
# WHAT THIS TESTS: how the new (4th) channel slot of encoder.conv_in /
# decoder.conv_out is seeded. 'zeros' starts pressure invisible to the frozen
# 694M trunk and lets it be learned from clean gradients; 'mean' (I3D-style)
# seeds the new slot with the average of the 3 pretrained RGB slots, so pressure
# enters the trunk from step 0 -- at the cost of perturbing the pretrained
# forward pass everywhere, since conv_in's output is no longer what the trunk
# was trained on.
#
# BASELINE (outputs/vae_inflate4_more, zeros init, same 10 epochs / 5e-5 /
# cosine / seed 42):
#     epoch  1  val_vrmse 0.1866
#     epoch  2  val_vrmse 0.1460
#     epoch 10  val_vrmse 0.10489   val_total_loss 0.03427
# Read epoch 1-2 for "does mean init start better" and epoch 10 for "does it end
# better". They can disagree: mean init's whole claim is a faster start.
#
# WHY NOT WSD / A HIGHER LR: configs/lrscan_1.5e-4.yaml diverged outright
# (epoch-1 val_vrmse 5.01, val_ssim 0.93). 1.5e-4 is not usable here, so the
# 30-epoch WSD plan is on hold and this run reverts to the last schedule that
# was known-stable. That also keeps the comparison against the baseline direct.
#
# ONE UNAVOIDABLE DIFFERENCE FROM THE BASELINE RUN: the LR schedule is now a
# multiplicative LambdaLR, so min_learning_rate acts as a ratio and the 10x
# adapter/decoder gap holds end to end (adapter finishes at 1e-5). The baseline
# used CosineAnnealingLR, whose eta_min was an absolute floor shared by both
# groups, so its adapter group collapsed to 1e-6 and the 10x quietly became 1x
# over the last epochs. Epochs 1-2 are unaffected (both far from the floor);
# only the last ~2 epochs of the endpoint comparison carry this caveat.
#
# NOTE ON THE LATENT SPACE: freeze_conv_in is false, so encoder.conv_in trains
# and the latent space MOVES -- and with mean init it moves from a *different*
# starting point than every previous checkpoint. Latents from
# preprocess_dataset.py must be re-encoded before any DiT training on this VAE.
#
# Usage (4 GPUs):
#   accelerate launch --num_processes 4 scripts/finetune_vae.py \
#       configs/finetune_vae_meaninit.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  # THE ONE CHANGE. New channel slots get the mean of the 3 pretrained slots at
  # the same patch position, instead of zero.
  inflate_init: "mean"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  channel_mean: [0.905097647712509, 0.0040453659499771295, -0.0019089379643528095, 0.9031908053899714]
  channel_std: [0.6607349375392083, 0.5328754120427532, 0.5262512462358824, 0.8050358917795326]
  normalization_clip: 5.0
  num_sim_frames: null
  # Same 675 eval sims as the baseline (same seed + randperm), so val_vrmse is
  # measured on exactly the same simulations.
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  # Back to the inflate_more peak: the last LR that trained stably here.
  learning_rate: 5e-5
  adapter_lr_multiplier: 10.0
  min_learning_rate: 1e-6
  # Back to cosine: decay starts right after warmup, as in the baseline.
  scheduler_type: "cosine"
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 8
  max_grad_norm: 5.0
  weight_decay: 0.0
  # 50, not the 100 the lrscan configs used -- matching the baseline matters
  # more than ramp safety at a peak already known to be stable.
  warmup_steps: 50
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  # Identical to the baseline. Changing any weight would make a val_total_loss
  # comparison meaningless and an init comparison unattributable.
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 25.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  # Constant disk instead of 6.3 GB/epoch. Does not touch training dynamics, so
  # the comparison against the baseline stands.
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "shockwave-cfd"]

seed: 42
output_dir: "outputs/vae_meaninit"
clean_output_dir: true
