# Shockwave VAE -- continue the finished 10-epoch run for longer, at a real LR.
#
# This is a WARM RESTART from epoch010, not a run from scratch. Exactly three
# things differ from configs/finetune_vae_inflate_resume3.yaml:
#
#   1. resume_from  -> epoch010 (the previous run's final weights)
#   2. learning_rate 5e-5 -> 2e-5, epochs 10 -> 30, with a fresh schedule
#   3. resume_weights_only: true  (see below -- without it 1 and 2 do nothing)
#
# Everything else -- loss weights, eval split, batch/accumulation, seed -- is
# byte-identical to the previous run, so val VRMSE is directly comparable to the
# 0.1042 it finished at and any change is attributable to "trained longer".
#
# WHY: the previous run was underfit, not overfit. 553M trainable parameters got
# 1200 optimizer steps; final train 0.0321 vs val 0.0330 is a 2.9% gap, and the
# curve flattened only because the cosine schedule reached min_learning_rate
# (1e-6). It stopped because the LR ran out, not because the model converged.
#
# NOTE ON THE LATENT SPACE: freeze_conv_in is false, so encoder.conv_in trains
# and the latent space MOVES. Latents already produced by preprocess_dataset.py
# become stale the moment this run's checkpoint is used, and must be re-encoded
# before DiT training. The fingerprint check in inference_shockwave.py will
# refuse a mismatched pairing rather than emit wrong physics silently.
#
# Usage (4 GPUs):
#   accelerate launch --num_processes 4 scripts/finetune_vae.py \
#       configs/finetune_vae_inflate_more.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  # False = encoder.conv_in trains (the 221,312-parameter patchify projection,
  # the only path by which pressure reaches the frozen 694M encoder trunk).
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null

# REQUIRED here. vae_shockwave_epoch010.state.pt sits next to that safetensors,
# and without this flag it would be restored: the optimizer moments, the
# *finished* cosine schedule (already at 1e-6) and epoch=10 all come back, so
# learning_rate: 2e-5 would be overridden and epochs: 30 would run as 11..30.
# The warm restart would silently not happen.
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  channel_mean: [0.905097647712509, 0.0040453659499771295, -0.0019089379643528095, 0.9031908053899714]
  channel_std: [0.6607349375392083, 0.5328754120427532, 0.5262512462358824, 0.8050358917795326]
  normalization_clip: 5.0
  num_sim_frames: null
  # Same 675 sims as every previous run (same seed + randperm), so the numbers
  # stay comparable.
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  # Warm restart. Not back to 5e-5, which would undo weights that are already
  # good; far above the 1e-6 the last run ended at, which is why it stalled.
  learning_rate: 5e-5
  adapter_lr_multiplier: 10.0
  min_learning_rate: 1e-6
  # ~30 x 120 = 3600 optimizer steps, 3x the entire previous run.
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 8
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 50
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  # UNCHANGED from the previous run on purpose, so this run isolates one
  # variable: more training at a usable LR.
  #
  # There is a known imbalance here worth fixing in a FOLLOW-UP run, not this
  # one: total = rmse + 0.3*ssim = 0.0152 + 0.3*0.0592, so SSIM is currently 54%
  # of the loss, while h1 at weight 0 contributes nothing (its raw value ~4e-4 is
  # ~37x smaller than RMSE, so it needs a weight around 25 to matter at all).
  # Raising h1 is the principled anti-blur lever for the smoothed shock fronts
  # and vortex edges -- but changing it here would make any improvement
  # unattributable.
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 25.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  keep_last_n: 3

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "decoder", "inflate", "shockwave-cfd"]

seed: 42
output_dir: "outputs/vae_inflate4_more"
clean_output_dir: true
