# Shockwave VAE -- mean init, wsd15 schedule, h1x2, lr1x. ONE variable changed
# against configs/finetune_vae_meaninit_wsd15_h1x2_lr1x.yaml:
# loss_weighting.weights.mlw  0.0 -> 0.0001 (MLW now contributes to the loss,
# at a deliberately tiny weight -- everything else, including adapter_lr_
# multiplier=1.0, is carried over unchanged from lr1x).
#
# WHY: MLW has been logged (weight 0.0, diagnostic only) in every run so far.
# Its RAW value is huge and noisy relative to the other terms -- lr1x's own
# log swings between ~50 and ~135 step to step, vs rmse's ~0.004-0.07 and
# h1's raw ~0.0000-0.005. That's 3-4 orders of magnitude larger, and it does
# not smooth out the way rmse does across steps.
#
# WHY 0.0001 AND NOT SOME OTHER NUMBER: this is chosen from MLW's own raw
# scale, not copied from how h1 or ssim were tuned. At mlw~70 (roughly the
# middle of the observed 50-135 band), weight 0.0001 gives an effective
# contribution of ~0.007 -- comparable to rmse's low end (~0.005-0.02), never
# dominant, and nowhere near h1's weighted contribution (up to ~0.25 at
# weight 50). A weight picked to "look small" in absolute terms (e.g. 0.01)
# would actually inject ~0.7 of loss at mlw~70, several times larger than
# every other term combined -- that is not a cautious first probe, it's
# accidentally making MLW the dominant loss.
#
# INSTABILITY PRECEDENT (why this is being run cautiously, one term at a
# time): configs/finetune_vae.yaml's header records that MLW previously
# destabilized training and caused reconstruction to collapse. That run used
# SoftAdapt (adaptive weighting), which un-suppressed MLW's weight over time
# as other terms shrank -- a different mechanism than what's being tested
# here. This run uses "fixed" weighting, so the specific auto-escalation
# failure mode does not apply. What DOES still apply, independent of
# weighting strategy, is MLW's raw noisiness -- so caution is still
# warranted even though the fixed-weight mechanism differs.
#
# WHAT TO READ AT THE END:
#   - val_vrmse vs lr1x's 0.095396 (own baseline, same adapter_lr_multiplier
#     and h1 weight, so this is the fair one-variable comparison) and vs
#     h1x2's 0.094739 / 21623's 0.094886.
#   - train_loss curve over the first 1-2 epochs (esp. the first ~200 warmup
#     steps): watch for spikes or non-recoverable jumps that don't appear in
#     lr1x's own log at the same steps -- that would indicate the fixed 1e-4
#     weight is still injecting too much noise from MLW's raw volatility.
#   - qualitatively: whether MLW's stated purpose (multi-level wavelet
#     structure) shows up as any visible change in the residual maps vs
#     lr1x/h1x2, beyond the vortex/shock edge behavior h1 already targets.
#
# KILL CRITERIA: if epoch 1 val_vrmse is dramatically worse than lr1x's own
# epoch 1 (0.236885) -- not just noisier, but clearly diverging -- or if
# train_loss shows sharp non-recoverable spikes in the first few hundred
# steps, kill and drop mlw weight further (e.g. 0.00005) rather than pushing
# through the full 15 epochs.
#
# Everything else -- inflate_init mean, wsd/0.7, 15 epochs, warmup 200, peak
# 5e-5, min 1e-6, accum 8, adapter_lr_multiplier 1.0, h1 weight 50, seed 42 --
# is byte-identical to configs/finetune_vae_meaninit_wsd15_h1x2_lr1x.yaml, so
# the MLW weight is the only attributable difference.
#
# NOTE ON THE LATENT SPACE: freeze_conv_in is still false, so encoder.conv_in
# still trains and the latent space still MOVES. Latents from
# preprocess_dataset.py must be re-encoded before any DiT training on this
# checkpoint. The fingerprint check in inference_shockwave.py refuses a
# mismatched pairing rather than emitting wrong physics silently.
#
# Usage (4 GPUs):
#   sbatch scripts/finetune_vae_4gpu.sbatch configs/finetune_vae_meaninit_wsd15_h1x2_lr1x_mlw.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  # Carried over from 21623: mean beat zeros/random on every prior ablation.
  inflate_init: "mean"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  channel_mean: [0.905097647712509, 0.0040453659499771295, -0.0019089379643528095, 0.9031908053899714]
  channel_std: [0.6607349375392083, 0.5328754120427532, 0.5262512462358824, 0.8050358917795326]
  normalization_clip: 5.0
  num_sim_frames: null
  # Same 675 eval sims as every prior run (same seed + randperm), so val_vrmse
  # is measured on exactly the same simulations.
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  # Every field below is identical to configs/finetune_vae_meaninit_wsd15_h1x2_lr1x.yaml.
  learning_rate: 5e-5
  adapter_lr_multiplier: 1.0
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  epochs: 15
  batch_size: 1
  # 4 GPUs: overridden to 8 by the sbatch wrapper anyway, kept here so a bare
  # `accelerate launch --num_processes 4` matches. CHANGE THIS TOGETHER WITH
  # --num_processes, never one alone -- it sets both the effective batch and
  # steps_per_epoch, and therefore the LR horizon.
  gradient_accumulation_steps: 8
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    # THE ONE CHANGE. 0.0 -> 0.0001: MLW now contributes a small, deliberately
    # restrained gradient (see header for how this number was derived from
    # MLW's own raw scale, not copied from h1/ssim's tuning).
    mlw: 0.0001

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 1
  num_samples: 2
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "mean-init", "wsd", "15ep", "h1x2", "lr1x", "mlw-low", "shockwave-cfd"]

seed: 42
# NOT outputs/vae_meaninit_wsd15_h1x2_lr1x -- clean_output_dir would wipe that
# run's checkpoint/results.
output_dir: "outputs/vae_meaninit_wsd15_h1x2_lr1x_mlw"
clean_output_dir: true
