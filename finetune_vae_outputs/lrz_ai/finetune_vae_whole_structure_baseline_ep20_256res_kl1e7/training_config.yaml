acceleration:
  compilation_mode: reduce-overhead
  compile_with_inductor: false
  mixed_precision_mode: bf16
adapter:
  activation: gelu
  channels:
  - density
  - momentum_x
  - momentum_y
  - pressure
  checkpoint: null
  default_temb: 0.0
  enabled: true
  freeze_conv_in: false
  hidden_channels: 32
  identity_init: false
  inflate_copy_channel: null
  inflate_init: zeros
  mode: inflate
  unfreeze_encoder_trunk: true
checkpoints:
  best_metric: val_vrmse
  interval: 1
  keep_last_n: 1
  save_best_only: true
  save_epochs:
  - 15
  save_last_state: true
clean_output_dir: true
data:
  channel_mean:
  - 0.9050976477108856
  - 0.004045365949982484
  - -0.0019089379638760548
  - 0.9031908053900578
  channel_order:
  - density
  - momentum_x
  - momentum_y
  - pressure
  channel_std:
  - 0.6618199912434938
  - 0.5335233432828087
  - 0.5268940723644505
  - 0.8053303341374023
  data_root: /mnt/data/train.h5
  eval_sims: 675
  log_transform_channels: []
  normalization_clip: 5.0
  normalization_stats_file: null
  num_dataloader_workers: 4
  num_sim_frames: null
  overfit_repeat: 1
  overfit_sims: null
loss:
  mlw_beta: 10.0
  mlw_eps: 1.0e-06
  spatial_level: 2
  temporal_level: 2
  wavelet: db2
loss_weighting:
  alpha: 1.5
  loss_names:
  - rmse
  - h1
  - ssim
  - mlw
  strategy: fixed
  temperature: 0.1
  weight_lr: 0.025
  weights:
    h1: 50.0
    kl: 1.0e-07
    mlw: 0.0
    rmse: 1.0
    ssim: 0.15
model:
  load_checkpoint: null
  model_source: LTXV_2B_0.9.6_DEV
optimization:
  batch_size: 4
  enable_gradient_checkpointing: true
  epochs: 20
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-05
  max_grad_norm: 5.0
  min_learning_rate: 1.0e-06
  plateau_factor: 0.5
  plateau_patience: 3
  plateau_threshold: 0.0001
  scheduler_type: wsd
  stable_end_epoch: null
  stable_fraction: 0.7
  warmup_start_factor: 0.01
  warmup_steps: 200
  weight_decay: 0.0
