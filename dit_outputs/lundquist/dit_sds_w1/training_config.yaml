acceleration:
  compilation_mode: reduce-overhead
  compile_with_inductor: false
  mixed_precision_mode: bf16
checkpoints:
  best_metric: val_total_loss
  interval: 120
  keep_last_n: 2
  save_best_only: false
  save_epochs: []
  save_last_state: true
conditioning:
  first_frame_conditioning_p: 1.0
data:
  num_dataloader_workers: 4
  preprocessed_data_root: dit_preprocessed/finetune_vae_whole_structure_baseline_ep20_sds_w1
flow_matching:
  timestep_sampling_mode: shifted_logit_normal
  timestep_sampling_params: {}
lora:
  alpha: 16
  dropout: 0.0
  enabled: false
  rank: 16
  target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
model:
  load_checkpoint: null
  model_source: LTXV_2B_0.9.6_DEV
optimization:
  batch_size: 4
  enable_gradient_checkpointing: true
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-05
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_params:
    eta_min: 1.0e-08
  scheduler_type: cosine
  steps: 8000
output_dir: /local/disk/hramachandran/work/wh_work/windinet/dit_outputs/lundquist/dit_sds_w1
resume_weights_only: false
scalar_conditioning:
  dropout: 0.1
  embedding_dim: 4096
  enabled: true
  fourier_features: 64
  mlp_hidden_dim: 256
  num_tokens_per_scalar: 4
  scalar_names:
  - gamma
  scalar_ranges:
    gamma:
    - 1.0
    - 2.0
seed: 42
validation:
  data_root: dit_preprocessed/finetune_vae_whole_structure_baseline_ep20_sds_w1/val
  interval: 600
  max_samples: 0
visualization:
  dpi: 150
  enabled: true
  frame_numbers:
  - 25
  - 50
  - 75
  - 100
  interval: 2000
  num_inference_steps: 20
  num_samples: 3
wandb:
  enabled: false
  entity: null
  project: shockwavenet
  tags:
  - cfd
  - full
  - 2b
  - scalar-only
  - lundquist
  - 128res
  - sds-vae
  - sds-untrained-critic
  - sds-w1
